<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message de Motivation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #1e293b;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            border-radius: 16px;
            padding: 80px 60px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            max-width: 580px;
            width: 100%;
            position: relative;
            animation: fadeIn 0.6s ease-out;
        }
        
        .message {
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 1.3;
            color: #1e293b;
            margin-bottom: 40px;
            letter-spacing: -0.025em;
        }
        
        .highlight {
            color: #dc2626;
            font-weight: 600;
        }
        
        .emoji {
            font-size: 2.5rem;
            margin-left: 12px;
            display: inline-block;
        }
        
        .reflection {
            font-size: 1.125rem;
            color: #64748b;
            font-weight: 400;
            line-height: 1.6;
            margin-top: 32px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .pause-moment {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 40px;
            border-left: 4px solid #dc2626;
        }
        
        .breathing-space {
            height: 60px;
            background: linear-gradient(to right, transparent, #e2e8f0, transparent);
            margin: 40px 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .breathing-space::after {
            content: "Prends une pause";
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
            background: white;
            padding: 0 16px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 60px 40px;
                margin: 15px;
            }
            
            .message {
                font-size: 1.875rem;
            }
            
            .reflection {
                font-size: 1rem;
            }
        }
        
        @media (hover: hover) {
            .container:hover {
                box-shadow: 
                    0 10px 15px -3px rgba(0, 0, 0, 0.1),
                    0 4px 6px -2px rgba(0, 0, 0, 0.05);
                transform: translateY(-1px);
                transition: all 0.2s ease;
            }
        }
        
        /* Animation subtile pour attirer l'attention sans être distrayante */
        .highlight {
            position: relative;
        }
        
        .highlight::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #dc2626;
            animation: underlineGrow 2s ease-out 1s both;
        }
        
        @keyframes underlineGrow {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">
            Tu vaux <span class="highlight">plus que 5 secondes</span> de plaisir. Reste fort<span class="emoji">💪</span>
        </div>
        
        <div class="breathing-space"></div>
        
        <div class="reflection">
            Chaque fois que tu résistes, tu construis la personne que tu veux devenir.
        </div>
        
        <div class="pause-moment">
            ⏸️ Ferme cet onglet. Va faire autre chose.
        </div>
    </div>
</body>
</html>
