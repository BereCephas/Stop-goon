<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop-goon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .main-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .message-box {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .main-message {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .highlight {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .emoji {
            font-size: 32px;
            margin-left: 10px;
        }

        .sub-message {
            font-size: 16px;
            opacity: 0.9;
        }

        .add-site-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .site-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            outline: none;
        }

        .site-input::placeholder {
            color: #666;
        }

        .add-btn, .show-blocked-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-blocked-btn {
            border-radius: 25px;
            width: 100%;
            height: 50px;
            font-size: 16px;
            margin-top: 15px;
        }

        .add-btn:hover, .show-blocked-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .current-site {
            text-align: center;
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .success-message {
            text-align: center;
            color: #4ecdc4;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
        }

        .blocked-sites-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .blocked-sites-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .blocked-sites-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .blocked-sites-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Scrollbar personnalisée */
        .blocked-sites-grid::-webkit-scrollbar {
            width: 8px;
        }

        .blocked-sites-grid::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .blocked-sites-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
        }

        .blocked-sites-grid::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
        }

        .site-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 2px solid #e0e6ed;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }

        .site-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .site-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .site-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
            color: white;
        }

        .site-details {
            flex: 1;
        }

        .site-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .site-status {
            font-size: 14px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .delete-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: scale(1.05);
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-message {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .empty-submessage {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .blocked-sites-container {
                margin: 10px;
                padding: 20px;
            }

            .site-card {
                padding: 15px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .site-info {
                flex-direction: column;
                gap: 10px;
            }

            .site-icon {
                margin-right: 0;
            }

            .site-name {
                font-size: 16px;
            }

            .blocked-sites-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .blocked-sites-container {
                margin: 5px;
                padding: 15px;
            }

            .site-card {
                padding: 12px;
            }

            .site-name {
                font-size: 14px;
            }

            .delete-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Stop-goon</div>
        <div class="status">
            <span>🛡️</span>
            <span>Protection active</span>
        </div>
    </div>

    <div class="main-content">
        <div class="message-box">
            <div class="main-message">
                Tu vaux <span class="highlight">plus que 5 secondes</span> de plaisir<span class="emoji">💪</span>
            </div>
            <div class="sub-message">
                Reste fort, tu le vaux bien
            </div>
        </div>

        <div class="add-site-section">
            <div class="section-title">Bloquer un nouveau site</div>
            <div class="input-group">
                <input 
                    type="text" 
                    class="site-input" 
                    placeholder="example.com"
                    id="domainInput"
                >
                <button class="add-btn" id="addBtn">+</button>
            </div>
            <div class="current-site" id="currentSite" style="display: none;">
                Site actuel détecté
            </div>
            <div class="success-message" id="successMessage">
                ✓ Site ajouté à la liste de blocage
            </div>
            <button class="show-blocked-btn" id="showBlockedBtn">
                📋 Afficher les sites bloqués
            </button>
        </div>

        <div class="blocked-sites-container" id="blockedSitesContainer">
            <div class="blocked-sites-title">Sites bloqués</div>
            <div class="blocked-sites-grid" id="blockedSitesGrid">
                <!-- Les sites bloqués apparaîtront ici -->
            </div>
        </div>
    </div>

    <script type="module" src="core.js"></script>
</body>
</html>
