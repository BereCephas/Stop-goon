<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop-goon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .main-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .message-box {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .main-message {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .highlight {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .emoji {
            font-size: 32px;
            margin-left: 10px;
        }

        .sub-message {
            font-size: 16px;
            opacity: 0.9;
        }

        .add-site-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .site-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            outline: none;
        }

        .site-input::placeholder {
            color: #666;
        }

        .add-btn, .show-blocked-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-blocked-btn {
            border-radius: 25px;
            width: 100%;
            height: 50px;
            font-size: 16px;
            margin-top: 15px;
        }

        .add-btn:hover, .show-blocked-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .current-site {
            text-align: center;
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .success-message {
            text-align: center;
            color: #4ecdc4;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
        }

        /* Styles pour la liste des sites bloqués */
        .blocked-sites-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            padding: 25px;
            margin-top: 20px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blocked-sites-container.show {
            max-height: 500px;
            opacity: 1;
        }

        .blocked-sites-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
        }

        .blocked-sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .site-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            transform: translateY(20px);
            opacity: 0;
            animation: slideInUp 0.6s ease forwards;
        }

        .site-card:nth-child(2) { animation-delay: 0.1s; }
        .site-card:nth-child(3) { animation-delay: 0.2s; }
        .site-card:nth-child(4) { animation-delay: 0.3s; }
        .site-card:nth-child(5) { animation-delay: 0.4s; }

        @keyframes slideInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .site-card:hover {
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .site-info {
            flex: 1;
        }

        .site-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .site-url {
            font-size: 12px;
            opacity: 0.7;
            color: #ccc;
        }

        .delete-btn {
            background: linear-gradient(45deg, #ff4757, #c44569);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: linear-gradient(45deg, #ff3838, #b33951);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Stop-goon</div>
        <div class="status">
            <span>🛡️</span>
            <span>Protection active</span>
        </div>
    </div>

    <div class="main-content">
        <div class="message-box">
            <div class="main-message">
                Tu vaux <span class="highlight">plus que 5 secondes</span> de plaisir<span class="emoji">💪</span>
            </div>
            <div class="sub-message">
                Reste fort, tu le vaux bien
            </div>
        </div>

        <div class="add-site-section">
            <div class="section-title">Bloquer un nouveau site</div>
            <div class="input-group">
                <input 
                    type="text" 
                    class="site-input" 
                    placeholder="example.com"
                    id="domainInput"
                >
                <button class="add-btn" id="addBtn">+</button>
            </div>
            <div class="current-site" id="currentSite" style="display: none;">
                Site actuel détecté
            </div>
            <div class="success-message" id="successMessage">
                ✓ Site ajouté à la liste de blocage
            </div>
            <button class="show-blocked-btn" id="showBlockedBtn">
                📋 Afficher les sites bloqués
            </button>
        </div>

        <div class="blocked-sites-container" id="blockedSitesContainer">
            <div class="blocked-sites-title">Sites bloqués</div>
            <div class="blocked-sites-grid" id="blockedSitesGrid">
                <!-- Les sites bloqués apparaîtront ici -->
            </div>
        </div>
    </div>

    <script type="module" src="background.js"></script>
</body>
</html>
